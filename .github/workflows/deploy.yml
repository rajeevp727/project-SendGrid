name: Deploy TriSend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'workers/**'
      - 'sdk/dotnet/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: trisend-dev-deploy
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: app-trisend-api-rj
  AZURE_FUNCTIONAPP_NAME: func-trisend-worker-rj
  AZURE_CLIENT_ID: c273a106-f6e5-4f95-81b2-7a534c6b6565
  AZURE_TENANT_ID: 90795233-bba4-4cf9-8340-be7c87d0786e
  AZURE_SUBSCRIPTION_ID: e410bcc1-62a7-4225-8341-a8b372c38e68

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: dotnet publish backend/TriSend.Api/TriSend.Api.csproj -c Release -o ./publish/api

      - name: Publish worker
        run: dotnet publish workers/TriSend.Worker/TriSend.Worker.csproj -c Release -o ./publish/worker

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish/api

      - name: Deploy worker
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish/worker
