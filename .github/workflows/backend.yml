name: Backend CI

on:
  push:
    branches: [main, upgrade/net10]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'workers/**'
      - 'sdk/dotnet/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'workers/**'
      - 'sdk/dotnet/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore backend/TriSend.Api/TriSend.Api.csproj
      - run: dotnet build backend/TriSend.Api/TriSend.Api.csproj --configuration Release --no-restore

      - run: dotnet restore workers/TriSend.Worker/TriSend.Worker.csproj
      - run: dotnet build workers/TriSend.Worker/TriSend.Worker.csproj --configuration Release --no-restore

      - run: dotnet restore sdk/dotnet/TriSend.Client/TriSend.Client.csproj
      - run: dotnet build sdk/dotnet/TriSend.Client/TriSend.Client.csproj --configuration Release --no-restore
